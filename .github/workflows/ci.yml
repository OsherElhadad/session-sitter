# ============================================================================
# CI — every push to main and every pull request
# ============================================================================
#
# Five parallel jobs, each answering one question:
#
#   1. test        — does it compile, lint, and pass on the Node versions we support?
#   2. package     — does a real installable .vsix build, and what is in it?
#   3. links       — does every relative link in the docs resolve?
#   4. spellcheck  — are the docs free of typos?
#   5. guards      — TypeScript only, settings consistent, one project name?
#   6. plugin      — is the committed plugin/lib fresh, and does the manifest validate?
#
# Every job runs the SAME commands a developer runs locally, through the Makefile or
# `ci/`. Nothing here is CI-only, so a green pipeline means `make check` was honest.
#
# `python3` matters: the extension reads IBM Bob's SQLite store through a read-only
# `python3 -c` shim (src/BobDatabase.ts), and the SessionManager / SessionExporter
# tests build real SQLite fixtures with it. It is pinned with setup-python rather than
# trusted from the runner image, so a change to that image cannot quietly break the
# suite.
# ============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to a PR makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # One failing version should still tell us about the other.
      fail-fast: false
      matrix:
        # 20 is the floor VS Code 1.9x ships; 22 is what current builds run.
        node: ['20', '22']

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # Required by the Bob SQLite shim and by the tests that build SQLite fixtures.
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Type-check, lint and test
        run: make check

  package:
    name: Package (.vsix)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build the .vsix
        run: make package

      # Printed into the log so a reviewer can see what a user would install, without
      # downloading anything. A file appearing here that should not ship is a review
      # finding.
      - name: List what ships inside it
        run: make ls-package

      # So a reviewer can install the exact build under review, from the PR page.
      - name: Upload the .vsix
        uses: actions/upload-artifact@v4
        with:
          name: session-sitter-vsix
          path: '*.vsix'
          if-no-files-found: error
          retention-days: 14

  links:
    name: Docs links
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Offline by design: an external-URL checker is flaky by construction, and a
      # flaky required check trains people to ignore CI. Needs no dependencies.
      - name: Check relative links resolve
        run: node ci/check-links.mjs

  spellcheck:
    name: Spellcheck (docs)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: codespell
        uses: codespell-project/actions-codespell@v2
        with:
          path: README.md docs knowledge skills
          # Dated design records, kept as written — rewriting one to satisfy a linter
          # would falsify the record.
          skip: docs/superpowers
          # `pre-empt` is deliberate, correct hyphenation.
          ignore_words_list: pre-empt

  guards:
    name: TypeScript-only guards
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Compiled first so the guard can also assert on the .vsix manifest — what users
      # actually install — and not just on the working tree.
      - name: Compile
        run: make compile

      - name: No Python source, no internal names
        run: bash ci/check-no-python.sh

      # Catches the drift a rename causes: the code reading one settings namespace while
      # package.json declares another. Nothing fails at runtime — every `config.get()` just
      # returns its fallback — so only comparing the two sides finds it.
      - name: Settings in code match package.json
        run: node ci/check-settings.mjs

      # The whole project carries one name. A leftover is a bug report waiting to happen.
      - name: No leftovers of the old project names
        run: bash ci/check-naming.sh

      # docs/onboarding/ is a skill an agent follows to write a real settings.json, so a stale
      # claim in it is a wrong setting in someone's configuration — not a documentation bug. This
      # proves every setting it names is declared, every check in its validator still fires, and
      # every shipped example still validates.
      - name: The onboarding skill matches this build's settings
        run: bash ci/check-onboarding.sh

  plugin:
    name: Claude Code plugin
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # plugin/lib/ is committed build output, because a plugin is installed by cloning a git
      # ref and nothing compiles it on the way in. Its one failure mode is shipping a version
      # behind the tests that vouch for it, so the guard rebuilds and diffs.
      - name: Compile
        run: make compile

      - name: plugin/lib is the current build of src/
        run: bash ci/check-plugin-lib.sh

      # Guarded, not required: the `claude` binary is not on a GitHub runner, and a check that
      # fails for being unavailable teaches people to ignore CI. It runs wherever the CLI is —
      # which is every developer's machine, via `make plugin-validate`.
      - name: Validate the plugin manifest (when the claude CLI is available)
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate ./plugin --strict
            claude plugin validate ./.claude-plugin/marketplace.json --strict
          else
            echo "claude CLI not present on this runner — skipping."
            echo "Run 'make plugin-validate' locally; it is the same two commands."
          fi

      # The hooks are the product's critical path, so prove the binaries actually run as
      # standalone processes — a compiled module that throws on load would pass every unit
      # test and fail at the first permission prompt.
      - name: The hook binaries run and emit a decision
        run: |
          set -euo pipefail
          export SESSION_SITTER_DATA_DIR="$(mktemp -d)"
          decision() {
            echo "$1" | node plugin/lib/hooks/permissionRequest.js
          }
          allow="$(decision '{"session_id":"ci","cwd":"/tmp","hook_event_name":"PermissionRequest","tool_name":"Read","tool_input":{"file_path":"/tmp/x"}}')"
          echo "$allow" | grep -q '"behavior":"allow"'
          fixed="$(decision '{"session_id":"ci","cwd":"/tmp","hook_event_name":"PermissionRequest","tool_name":"Bash","tool_input":{"command":"git push --force origin main"}}')"
          echo "$fixed" | grep -q -- '--force-with-lease'
          denied="$(decision '{"session_id":"ci","cwd":"/tmp","hook_event_name":"PermissionRequest","tool_name":"Write","tool_input":{"file_path":"/tmp/a","content":"x"}}')"
          echo "$denied" | grep -q '"behavior":"deny"'
          echo '{"session_id":"ci"}' | node plugin/statusline.js
          node plugin/lib/audit/cli.js log
          echo "✓ the hook binaries decide, correct and fail closed"
